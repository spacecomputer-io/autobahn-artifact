[package]
name = "store"
version = "0.1.0"
authors = ["Alberto Sonnino <alberto@sonnino.com>"]
edition = "2018"
publish = false

[dependencies]
rocksdb = { version = "0.16.0", default-features = false, features = ["lz4", "zstd", "snappy"] }
tokio = { version = "1.5.0", features = ["sync", "macros", "rt"] }